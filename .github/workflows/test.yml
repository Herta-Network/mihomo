name: Test
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - Alpha
      - Meta
    tags:
      - "v*"
  pull_request:
    branches:
      - Alpha
      - Meta

jobs:
  test:
    strategy:
      matrix:
        os:
          - 'ubuntu-latest' # amd64 linux
          - 'windows-latest' # amd64 windows
          - 'macos-latest' # arm64 macos
          - 'ubuntu-24.04-arm' # arm64 linux
          - 'windows-11-arm' # arm64 windows
          - 'macos-26-intel' # amd64 macos
        go-version:
          - '1.26'
          - '1.25'
          - '1.24'
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      # Fix mingw trying to be smart and converting paths https://github.com/moby/moby/issues/24029#issuecomment-250412919
      MSYS_NO_PATHCONV: true
      # Skip mihomo inbound interop test
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: ${{ matrix.go-version }}

      - name: Verify Go installation
        run: go version

      - name: Verify Go env
        run: go env

      - name: Verify a single sing implementation
        run: python3 scripts/check-sing-source.py

      - name: Test sing fork integration with race detector
        if: matrix.go-version == '1.26' && (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest' || matrix.os == 'macos-latest')
        env:
          CGO_ENABLED: 1
        run: >-
          go test -race ./common/net/... ./common/callback ./adapter/outbound ./listener/sing ./listener/sing_shadowsocks ./listener/inbound ./tunnel/... ./transport/snell ./transport/trojan ./transport/vless ./transport/vless/reverse ./transport/vmess ./transport/gost ./transport/gun ./transport/sudoku ./transport/trusttunnel ./transport/simple-obfs ./transport/shadowsocks/shadowaead
          -run 'TestRelay|TestPacket|TestProtocolPacket|TestSingPacketIntegration|TestInboundSnellBatch|TestTLSPayloadCount|TestReverse'
          -count=1 -timeout=90s

      - name: Test sing fork integration with low memory buffers
        if: matrix.go-version == '1.26' && (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest' || matrix.os == 'macos-latest')
        run: >-
          go test -tags with_low_memory ./common/net/... ./common/callback ./adapter/outbound ./listener/sing ./listener/sing_shadowsocks ./listener/inbound ./tunnel/... ./transport/snell ./transport/trojan ./transport/vless ./transport/vless/reverse ./transport/vmess ./transport/gost ./transport/gun ./transport/sudoku ./transport/trusttunnel ./transport/simple-obfs ./transport/shadowsocks/shadowaead
          -run 'TestRelay|TestPacket|TestProtocolPacket|TestSingPacketIntegration|TestInboundSnellBatch|TestTLSPayloadCount|TestReverse'
          -count=1 -timeout=90s

      - name: Remove inbound test for macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          rm -rf listener/inbound/*_test.go

      - name: Test
        run: go test ./... -v -count=1

      - name: Test with tag with_gvisor
        run: go test ./... -v -count=1 -tags "with_gvisor"

      - name: Test Snell concurrency and interoperability
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        env:
          CGO_ENABLED: 1
        run: >-
          go test -race ./adapter/outbound ./listener/inbound
          -run 'TestSnell|TestInboundSnell($|Batch|UDP|HalfCloseAndReuse|LegacyV4Client|CloseUnblocksHandshake|_ShadowTls|_JLS)'
          -count=1 -timeout=3m

      - name: Test VLESS Reverse against Xray
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        env:
          CGO_ENABLED: 1
          SKIP_INTEROP_TEST: 0
        run: |
          archive="$RUNNER_TEMP/xray-v26.10.31.zip"
          binary_dir="$RUNNER_TEMP/xray-vless-reverse"
          curl --fail --location --retry 3 https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip --output "$archive"
          printf '%s  %s\n' e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214 "$archive" | sha256sum --check
          mkdir -p "$binary_dir"
          unzip -o "$archive" xray -d "$binary_dir"
          chmod +x "$binary_dir/xray"
          XRAY_TEST_BINARY="$binary_dir/xray" go test -race ./transport/gun ./transport/vless/... ./listener/sing_vless ./listener/inbound -run 'TestReverse|TestVlessReverse|TestConn|TestVisionResponseHeadroomConcurrent' -count=1 -timeout=3m
